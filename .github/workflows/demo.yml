name: demo

on:
  workflow_dispatch: {}
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Render with a go-installed vhs (github.com/charmbracelet/vhs@latest,
      # built from main). Both vhs-action@v2 and the v0.12.0 release tarball
      # "rendered" the tape but produced no gif anywhere in the tree on
      # ubuntu-24.04 — a silent failure on every tag since v0.1.0; the
      # go-install build is the recipe the green demo workflows in this
      # portfolio use.
      - name: Install vhs + deps (ffmpeg, ttyd, vhs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
      - name: Render demo.gif
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          vhs docs/demo.tape
      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.gif
          git commit -m "chore: render demo gif" || { echo "no change"; exit 0; }
          # The checkout is at the tag (detached HEAD); main may have moved past
          # it — rebase the gif commit onto origin/main so the push fast-forwards.
          git fetch origin main
          git rebase origin/main --empty=drop
          git push origin HEAD:main
