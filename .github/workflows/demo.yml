name: demo

on:
  workflow_dispatch: {}
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Render with a directly-installed vhs (the vhs-action@v2 wrapper ran the
      # tape in its own context, so assets/demo.gif never landed in the repo
      # and the commit step failed on every tag since v0.1.0). Pinned version,
      # matching the working demo pattern elsewhere in this portfolio.
      - name: Install vhs + deps (ffmpeg, ttyd, vhs 0.12.0)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          curl -fsSL -o /tmp/vhs.tgz https://github.com/charmbracelet/vhs/releases/download/v0.12.0/vhs_0.12.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/vhs.tgz -C /usr/local/bin vhs
          sudo chmod +x /usr/local/bin/vhs
      - name: Render demo.gif
        run: vhs docs/demo.tape
      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.gif
          git commit -m "chore: render demo gif" || { echo "no change"; exit 0; }
          # The checkout is at the tag (detached HEAD); main may have moved past
          # it — rebase the gif commit onto origin/main so the push fast-forwards.
          git fetch origin main
          git rebase origin/main --empty=drop
          git push origin HEAD:main
